<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bé khám phá các số từ 1 đến 10</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#c9ecdc url(garden.webp) center/cover fixed;color:#203756;font-family:Arial,sans-serif;padding:4vh 3vw}main{background:#f5fff3eb;border-radius:28px;padding:3vw;text-align:center}h1{font-size:clamp(22px,4vw,64px);margin:0 0 4vh}.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:1vw}button{cursor:pointer;background:white;color:#203756;border:2px solid #649c92;border-radius:14px;font:bold clamp(16px,4vw,60px) Arial;width:100%;min-height:56px}button:hover,button:focus-visible{background:#d2f4ff;outline:3px solid #165f86}button[aria-expanded=true]{background:#ffce78}.frame{margin-top:14px;padding:4px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;background:#75aca5;border-radius:8px}.frame[hidden]{display:none}.cell{background:white;aspect-ratio:1;border-radius:4px;display:grid;place-items:center}.bead{width:66%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 38% 50%,white 6%,transparent 9%),radial-gradient(circle at 62% 50%,white 6%,transparent 9%),#e74670}footer{display:flex;gap:12px;justify-content:center;margin-top:4vh}footer button{width:auto;padding:8px 20px;font-size:18px}
</style>
<main><h1>Bé khám phá các số từ 1 đến 10</h1><div class="board"></div><footer><button id="reset">Làm lại</button><button id="full">Toàn màn hình</button></footer></main>
<script>
const board=document.querySelector('.board');
for(let n=1;n<=10;n++){
 const column=document.createElement('div');
 const button=document.createElement('button');
 const frame=document.createElement('div');
 button.textContent=n;
 frame.className='frame';
 frame.id='frame-'+n;
 frame.hidden=true;
 frame.setAttribute('aria-label',n+' hạt trong khung 10 ô');
 button.setAttribute('aria-controls',frame.id);
 button.setAttribute('aria-expanded','false');
 for(let i=0;i<10;i++){
  const cell=document.createElement('span');
  cell.className='cell';
  if(i<n){const bead=document.createElement('span');bead.className='bead';cell.append(bead);}
  frame.append(cell);
 }
 button.onclick=()=>{frame.hidden=false;button.setAttribute('aria-expanded','true');};
 column.append(button,frame);
 board.append(column);
}
document.querySelector('#reset').onclick=()=>{
 document.querySelectorAll('.frame').forEach(frame=>frame.hidden=true);
 board.querySelectorAll('button').forEach(button=>button.setAttribute('aria-expanded','false'));
};
document.querySelector('#full').onclick=async()=>{
 if(document.fullscreenElement)await document.exitFullscreen();
 else await document.documentElement.requestFullscreen();
};
</script>
